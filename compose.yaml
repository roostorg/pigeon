services:
  pigeon:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Publish binding only (not app config). Override e.g.:
      #   PIGEON_PUBLISH_ADDR=0.0.0.0 PIGEON_PUBLISH_PORT=8901 docker compose up
      - "${PIGEON_PUBLISH_ADDR:-127.0.0.1}:${PIGEON_PUBLISH_PORT:-8900}:8900"
    # App settings come from .env (cp .env.example .env). Do not re-list them here.
    env_file:
      - path: .env
        required: true
    environment:
      PIGEON_HOST: "0.0.0.0"
      PIGEON_MODELSPECS_DIR: /app/modelspecs
      PIGEON_DB_PATH: /var/lib/pigeon/pigeon.db
    volumes:
      - pigeon-data:/var/lib/pigeon
      - ./modelspecs:/app/modelspecs:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pigeon-data:
